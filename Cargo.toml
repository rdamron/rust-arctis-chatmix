[package]
name = "rust-arctis-chatmix"
version = "0.1.0"
edition = "2021"
description = "ChatMix daemon for SteelSeries Arctis Nova Pro Wireless: creates Game/Chat PipeWire sinks and drives their volumes from the base station wheel"
license = "MIT"

[dependencies]
libc = "0.2"
serde_json = "1"

[profile.release]
strip = true
lto = true
